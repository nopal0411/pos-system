<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Activity Diagram – POS System Toko Fenny Grosir</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;padding:36px 16px;color:#e2e8f0}
/* ── HEADER ── */
.hdr{text-align:center;max-width:960px;margin:0 auto 32px}
.hdr .badge{display:inline-block;background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 16px;border-radius:50px;margin-bottom:12px}
.hdr h1{font-family:'Poppins',sans-serif;font-size:clamp(16px,2.4vw,22px);font-weight:800;background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.4;margin-bottom:8px}
.hdr p{font-size:12px;color:#94a3b8}
/* ── TABS ── */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1100px;margin:0 auto 28px}
.tab-btn{padding:8px 18px;border-radius:50px;border:1.5px solid rgba(99,102,241,0.4);background:rgba(99,102,241,0.1);color:#a78bfa;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;font-family:'Inter',sans-serif}
.tab-btn:hover{background:rgba(99,102,241,0.25)}
.tab-btn.active{background:linear-gradient(90deg,#6366f1,#7c3aed);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(99,102,241,0.4)}
/* ── PANEL ── */
.panel{display:none;max-width:1100px;margin:0 auto;animation:fadeUp .4s ease}
.panel.active{display:block}
/* ── DIAGRAM CARD ── */
.diagram-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px 16px;box-shadow:0 24px 60px rgba(0,0,0,0.4);backdrop-filter:blur(10px)}
.diagram-card svg{width:100%;height:auto;display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="hdr">
  <div class="badge">Activity Diagram</div>
  <h1>Activity Diagram – POS System Toko Fenny Grosir</h1>
  <p>Aktor: <strong>User</strong> &nbsp;|&nbsp; <strong>Sistem</strong> &nbsp;·&nbsp; Metode Waterfall &nbsp;·&nbsp; Algoritma Linear Search</p>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('login')">UC-01 Login</button>
  <button class="tab-btn" onclick="showTab('barang')">UC-02 Manajemen Barang</button>
  <button class="tab-btn" onclick="showTab('laporan')">UC-03 Laporan Penjualan</button>
  <button class="tab-btn" onclick="showTab('transaksi')">UC-04 Proses Transaksi</button>
  <button class="tab-btn" onclick="showTab('struk')">UC-05 Cetak Struk</button>
  <button class="tab-btn" onclick="showTab('logout')">UC-06 Logout</button>
</div>
